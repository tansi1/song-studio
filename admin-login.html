<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sóng Studio | Admin Login</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <!-- LOGO -->

            <img
                src="pic/icon_logo.png"
                alt="Sóng Studio"
                class="login-logo"
            >

            <span class="admin-label">
                ADMIN PANEL
            </span>

            <h1>
                ĐĂNG NHẬP
            </h1>

            <p class="login-description">
                Quản lý website Sóng Studio
            </p>

            <!-- FORM -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@songstudio.vn"
                        required
                    >

                </div>

                <<div class="input-group">

    <label for="password">
        Mật khẩu
    </label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="Hiện mật khẩu"
        >
            👁
        </button>

    </div>

</div>

                <p
                    id="loginStatus"
                    class="login-status"
                ></p>

                <button
                    type="submit"
                    class="login-btn"
                >
                    ĐĂNG NHẬP
                </button>

            </form>

            <a
                href="index.html"
                class="back-site"
            >
                ← Quay lại website
            </a>

        </div>

    </div>

    <script
        type="module"
        src="admin-login.js"
    ></script>

</body>

</html>
